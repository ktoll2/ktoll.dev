<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173f32">
    <meta name="robots" content="noindex">
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("ktoll-theme");
          const theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>Page Not Found | Kirk Tolleshaug</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/">
        <svg class="wordmark-icon" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#173f32"/>
          <path fill="#f5f1e8" d="M16 19h5v10l10-10h7L25 32l14 13h-7L21 35v10h-5z"/>
          <path fill="#91c9a5" d="M40 41h12v4H40z"/>
        </svg>
        <span class="wordmark-copy">
          <span>Kirk Tolleshaug</span>
          <span class="wordmark-subtitle">Senior Backend Software Engineer</span>
          <span class="wordmark-location">Vancouver, Washington, United States</span>
        </span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="/blog/">Blog</a>
      </nav>
      <button class="theme-toggle" type="button" aria-pressed="false">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.1A8.7 8.7 0 0 1 8.9 3.3 8.7 8.7 0 1 0 20.7 15.1Z"/></svg>
        <span class="toggle-thumb" aria-hidden="true"></span>
        <span class="visually-hidden">Switch to dark mode</span>
      </button>
    </header>
    <main class="not-found page-section">
      <div>
        <p class="section-label">Error 404</p>
        <h1>That route does not lead anywhere useful.</h1>
        <p>The page may have moved, or the address may be incorrect.</p>
        <a class="button button-primary" href="/">Return home <span class="button-icon button-icon-arrow" aria-hidden="true"></span></a>
