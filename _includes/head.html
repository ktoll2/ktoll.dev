<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b8bab0">
  {% if page.noindex %}
    <meta name="robots" content="noindex">
  {% endif %}
  <script>
    (() => {
      document.documentElement.classList.add("js");

      try {
        const savedTheme = localStorage.getItem("ktoll-theme");
        const theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111b17" : "#b8bab0";
      } catch {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#b8bab0";
      }
    })();
  </script>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.social_description | default: page.description | default: site.description }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  {% if page.layout == "post" %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  {% endif %}
  <meta property="og:url" content="{{ page.canonical_url | default: page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.social_image | default: '/assets/images/social-preview-light.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ page.social_image_alt | default: 'Kirk Tolleshaug, Senior Backend Software Engineer' }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.social_description | default: page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ page.social_image | default: '/assets/images/social-preview-light.png' | absolute_url }}">
  <meta name="twitter:image:alt" content="{{ page.social_image_alt | default: 'Kirk Tolleshaug, Senior Backend Software Engineer' }}">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="canonical" href="{{ page.canonical_url | default: page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/header.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/footer.css' | relative_url }}">
  {% if page.blog_page or page.layout == "post" %}
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  {% endif %}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": {{ site.author.name | jsonify }},
      "jobTitle": {{ site.author.job_title | jsonify }},
      "url": {{ site.url | jsonify }},
      "email": {{ "mailto:" | append: site.author.email | jsonify }},
      "sameAs": [{{ site.author.linkedin | jsonify }}, {{ site.author.github | jsonify }}],
      "address": { "@type": "PostalAddress", "addressLocality": {{ site.author.address.city | jsonify }}, "addressRegion": {{ site.author.address.region | jsonify }}, "addressCountry": {{ site.author.address.country | jsonify }} }
    }
  </script>
  {% if page.layout == "post" %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": {{ page.title | jsonify }},
        "description": {{ page.description | default: site.description | jsonify }},
        "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
        {% if page.last_modified_at %}
          "dateModified": {{ page.last_modified_at | date_to_xmlschema | jsonify }},
        {% endif %}
        "mainEntityOfPage": { "@type": "WebPage", "@id": {{ page.canonical_url | default: page.url | absolute_url | jsonify }} },
        "image": {{ page.social_image | default: '/assets/images/social-preview-light.png' | absolute_url | jsonify }},
        "author": { "@type": "Person", "name": {{ page.author | default: site.author.name | jsonify }} }
      }
    </script>
  {% endif %}
</head>
